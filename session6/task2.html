<!DOCTYPE html>
<html>

<head>
    <title>Product Tile</title>

    <style>
        .product {
            width: 250px;
            padding: 15px;
            border: 1px solid #ccc;
            margin: 20px;
        }
        
        img {
            width: 200px;
            display: block;
        }
        
        .product-name {
            display: inline-block;
            font-size: 20px;
            margin-top: 10px;
        }
        
        .price {
            display: inline-block;
            color: green;
            font-weight: bold;
        }
        
        .hide-price {
            display: none;
        }
    </style>
</head>

<body>

    <div class="product">

        <img src="images.jpg" alt="Product">

        <h2 class="product-name">Wireless Headphones</h2>

        <p class="price">₹10,999</p>

    </div>

</body>

</html>
