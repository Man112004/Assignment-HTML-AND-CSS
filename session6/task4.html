<!DOCTYPE html>
<html>

<head>
    <title>Movie Posters</title>

    <style>
        .movie-grid {
            display: flex;
            gap: 20px;
        }
        
        .movie {
            position: relative;
            width: 200px;
        }
        
        .movie img {
            width: 200px;
            height: 280px;
        }
        
        .new-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 10px;
            background-color: red;
            color: white;
        }
    </style>
</head>

<body>

    <h1>BookMyShow Movies</h1>

    <div class="movie-grid">

        <div class="movie">
            <img src="Movie1.jpg" alt="Movie 1">
            <span class="new-badge">New</span>
        </div>

        <div class="movie">
            <img src="Movie2.jpg" alt="Movie 2">
        </div>

        <div class="movie">
            <img src="Movie3.jpg" alt="Movie 3">
        </div>

    </div>

</body>

</html>
