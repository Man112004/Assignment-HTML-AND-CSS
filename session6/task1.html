<!DOCTYPE html>
<html>

<head>
    <title>Restaurant Card</title>

    <style>
        .restaurant-card {
            width: 300px;
            margin: 30px;
            padding: 20px;
            border: 2px solid #ddd;
        }
        
        .restaurant-name {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        
        .cuisine {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        
        .rating {
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="restaurant-card">

        <h2 class="restaurant-name">The Food House</h2>

        <p class="cuisine">North Indian, Chinese</p>

        <p class="rating">Rating: ⭐ 4.5</p>

    </div>

</body>

</html>
