<!DOCTYPE html>
<html>

<head>
    <title>Social Links</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 30px;
        }
        
        .form {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        
        .input-box {
            position: relative;
            margin: 15px 0;
        }
        
        .input-box img {
            position: absolute;
            left: 10px;
            top: 10px;
            width: 25px;
            height: 25px;
        }
        
        .input-box input {
            width: 90%;
            padding: 12px 10px 12px 50px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="form">

        <h2>Social Links</h2>

        <div class="input-box">
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
            <input type="url" placeholder="Instagram URL">
        </div>

        <div class="input-box">
            <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png">
            <input type="url" placeholder="LinkedIn URL">
        </div>

        <div class="input-box">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png">
            <input type="url" placeholder="Twitter URL">
        </div>

    </div>

</body>

</html>
