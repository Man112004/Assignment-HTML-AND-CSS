<!DOCTYPE html>
<html>

<head>
    <title>Food Order</title>
</head>

<body>

    <h2>Food Order Form</h2>

    <form>
        <!-- Order ID is fixed, so the user should not change it. -->
        <!-- disabled means the user cannot edit or change that input field. -->
        <label for="orderId">Order ID:</label>
        <input type="text" id="orderId" name="orderId" value="ORD12345" disabled>
        <br><br>

        <label for="username">User Name:</label>
        <input type="text" id="username" name="username" required>
        <br><br>

        <label for="food">Food Item:</label>
        <select id="food" name="food" required>
            <option value="" disabled selected>Select Food</option>
            <option value="pizza">Pizza</option>
            <option value="burger">Burger</option>
            <option value="biryani">Pav Bhaji</option>
        </select>
        <br><br>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" required>
        <br><br>

        <label for="instructions">Delivery Instructions:</label>
        <br>
        <textarea id="instructions" name="instructions" required></textarea>
        <br><br>

        <button type="submit">Place Order</button>

    </form>

</body>

</html>
