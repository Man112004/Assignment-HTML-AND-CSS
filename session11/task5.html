<!DOCTYPE html>
<html>

<head>
    <title>Task 5 - Theme Switcher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div id="mainContainer" class="container bg-light text-dark p-5">

        <h2>Movie Booking Page</h2>

        <p>
            Welcome to our movie booking website.
        </p>

        <button class="btn btn-primary" onclick="changeTheme()">
        Change Theme
    </button>

    </div>


    <script>
        function changeTheme() {

            let container = document.getElementById("mainContainer");

            container.classList.toggle("bg-light");
            container.classList.toggle("bg-dark");

            container.classList.toggle("text-dark");
            container.classList.toggle("text-light");

        }
    </script>

</body>

</html>
