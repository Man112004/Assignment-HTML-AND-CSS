<!DOCTYPE html>
<html>

<head>
    <title>Product Showcase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="container mt-5">

        <h2 class="text-center mb-4">Featured Products</h2>

        <div class="row">


            <div class="col-6 col-md-3 mb-4">
                <div class="card h-100 shadow-sm">

                    <img src="product1.jpg" class="card-img-top product-img" alt="Headphones">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Wireless Headphones
                        </h5>

                        <p class="text-success fw-bold">
                            ₹999
                        </p>

                        <button class="btn btn-primary">
                        Buy Now
                    </button>

                    </div>
                </div>
            </div>

            <div class="col-6 col-md-3 mb-4">
                <div class="card h-100 shadow-sm">

                    <img src="product2.jpg" class="card-img-top product-img" alt="Smart Watch">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Smart Watch
                        </h5>

                        <p class="text-success fw-bold">
                            ₹1,499
                        </p>

                        <button class="btn btn-primary">
                        Buy Now
                    </button>

                    </div>
                </div>
            </div>


            <div class="col-6 col-md-3 mb-4">
                <div class="card h-100 shadow-sm">

                    <img src="product3.jpg" class="card-img-top product-img" alt="Bluetooth Speaker">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Bluetooth Speaker
                        </h5>

                        <p class="text-success fw-bold">
                            ₹799
                        </p>

                        <button class="btn btn-primary">
                        Buy Now
                    </button>

                    </div>
                </div>
            </div>

            <div class="col-6 col-md-3 mb-4">
                <div class="card h-100 shadow-sm">

                    <img src="product4.jpg" class="card-img-top product-img" alt="Wireless Earbuds">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Wireless Earbuds
                        </h5>

                        <p class="text-success fw-bold">
                            ₹1,299
                        </p>

                        <button class="btn btn-primary">
                        Buy Now
                    </button>

                    </div>
                </div>
            </div>

        </div>

    </section>

</body>

</html>
