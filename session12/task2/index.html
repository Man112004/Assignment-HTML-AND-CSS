<!DOCTYPE html>
<html>

<head>
    <title>Featured Playlists</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f3ff;
        }
        
        .playlist-img {
            height: 220px;
            object-fit: cover;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">
            Featured Playlists
        </h2>

        <div class="row">

            <div class="col-md-4 mb-4">

                <div class="card shadow">

                    <img src="playlist1.jpg" class="card-img-top playlist-img" alt="Romantic Hits">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Romantic Hits
                        </h5>

                        <p class="card-text text-muted">
                            Best romantic songs
                        </p>

                        <button class="btn btn-success">
                            Listen Now
                        </button>

                    </div>

                </div>

            </div>


            <div class="col-md-4 mb-4">

                <div class="card shadow">

                    <img src="playlist2.jpg" class="card-img-top playlist-img" alt="Top Bollywood">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Top Bollywood
                        </h5>

                        <p class="card-text text-muted">
                            Latest Bollywood songs
                        </p>

                        <button class="btn btn-success">
                            Listen Now
                        </button>

                    </div>

                </div>

            </div>


            <div class="col-md-4 mb-4">

                <div class="card shadow">

                    <img src="playlist3.jpg" class="card-img-top playlist-img" alt="Best Songs">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Best Songs
                        </h5>

                        <p class="card-text text-muted">
                            Popular songs collection
                        </p>

                        <button class="btn btn-success">
                            Listen Now
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
