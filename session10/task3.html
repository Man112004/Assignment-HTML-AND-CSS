<!DOCTYPE html>
<html>

<head>
    <title>Movie Carousel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h2 class="text-center">Featured Movies</h2>

        <div id="movieCarousel" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="movie1.jpg" class="d-block w-100" alt="Movie 1">

                    <div class="carousel-caption">
                        <h5>Movie One</h5>
                        <p>Action Movie</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="movie2.jpg" class="d-block w-100" alt="Movie 2">

                    <div class="carousel-caption">
                        <h5>Movie Two</h5>
                        <p>Comedy Movie</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="movie3.jpg" class="d-block w-100" alt="Movie 3">

                    <div class="carousel-caption">
                        <h5>Movie Three</h5>
                        <p>Drama Movie</p>
                    </div>
                </div>

            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#movieCarousel" data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>

        </button>

            <button class="carousel-control-next" type="button" data-bs-target="#movieCarousel" data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>

        </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
