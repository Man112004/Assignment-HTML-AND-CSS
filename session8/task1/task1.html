<!DOCTYPE html>
<html>

<head>
    <title>Product Card</title>

    <!-- Required meta viewport tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .product-card {
            width: 600px;
            margin: 50px auto;
            padding: 20px;
            display: flex;
            gap: 25px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
            font-family: Arial;
        }
        
        .product-card img {
            width: 220px;
            height: 220px;
            object-fit: contain;
        }
        
        .details {
            flex: 1;
        }
        
        .details h2 {
            font-size: 24px;
        }
        
        .price {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }
        
        .buy-button {
            background: #2874f0;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="product-card">

        <img src="https://via.placeholder.com/220" alt="Product">

        <div class="details">
            <h2>Wireless Headphones</h2>
            <p>Bluetooth Wireless Headphones with good sound quality.</p>
            <p class="price">₹999</p>
            <button class="buy-button">Buy Now</button>
        </div>

    </div>

</body>

</html>
