<!DOCTYPE html>
<html>

<head>
    <title>Spotify Playlist</title>

    <style>
        .playlist-item {
            background-color: #222;
            color: white;
            padding: 15px;
            margin: 5px;
        }
        
        #playing {
            background-color: green;
        }
    </style>
</head>

<body>

    <h2>My Playlist</h2>

    <div class="playlist-item">
        Song 1 - Perfect
    </div>

    <div class="playlist-item" id="playing">
        Song 2 - Shape of You
    </div>

    <div class="playlist-item">
        Song 3 - Believer
    </div>

</body>

</html>
