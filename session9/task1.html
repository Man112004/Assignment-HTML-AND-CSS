<!DOCTYPE html>
<html>

<head>
    <title>Product Cards</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h2 class="text-center mb-4">Flipkart Products</h2>

        <div class="row">

            <div class="col-md-4">
                <div class="card p-3">
                    <h4>Mobile Phone</h4>
                    <p>Samsung Galaxy Smartphone</p>
                    <h5>₹15,999</h5>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3">
                    <h4>Laptop</h4>
                    <p>HP Laptop with 8GB RAM</p>
                    <h5>₹45,999</h5>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3">
                    <h4>Headphones</h4>
                    <p>Wireless Bluetooth Headphones</p>
                    <h5>₹1,999</h5>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
