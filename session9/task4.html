<!DOCTYPE html>
<html>

<head>
    <title>Responsive Movie Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <div class="col-12 col-md-6">
                <div class="card p-3">
                    <h3>Movie Poster</h3>
                    <img src="Movie1.jpg" class="img-fluid">
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="card p-3">
                    <h3>Movie Details</h3>
                    <p><strong>Title:</strong> Avengers</p>
                    <p><strong>Genre:</strong> Action</p>
                    <p><strong>Rating:</strong> 4.5/5</p>

                    <button class="btn btn-primary">
                    Book Now
                </button>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
