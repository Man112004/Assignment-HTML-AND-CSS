<!DOCTYPE html>
<html>

<head>
    <title>Zomato Restaurant Listing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h2 class="text-center">Restaurants</h2>

        <div class="row">

            <div class="col-6">
                <div class="card p-3 mb-3">
                    <h4>Pizza Palace</h4>
                    <p>Delicious pizza, pasta and Italian food.</p>
                </div>
            </div>

            <div class="col-6">
                <div class="card p-3 mb-3">
                    <h4>Food Corner</h4>
                    <p>Indian, Chinese and fast food available.</p>
                </div>
            </div>

            <div class="col-6">
                <div class="card p-3 mb-3">
                    <h4>Spice Garden</h4>
                    <p>Enjoy tasty Indian and Gujarati dishes.</p>
                </div>
            </div>

            <div class="col-6">
                <div class="card p-3 mb-3">
                    <h4>Burger House</h4>
                    <p>Fresh burgers, fries and cold drinks.</p>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
