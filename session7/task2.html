<!DOCTYPE html>
<html>

<head>
    <title>Spotify Playlist</title>

    <style>
        .playlist {
            display: flex;
            gap: 10px;
        }
        
        .song {
            width: 150px;
            height: 80px;
            background-color: lightgreen;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .song h3 {
            margin: 5px;
        }
        
        .song p {
            margin: 5px;
        }
    </style>
</head>

<body>

    <h2>My Playlist</h2>

    <div class="playlist">

        <div class="song">
            <h3>Perfect</h3>
            <p>Ed Sheeran</p>
        </div>

        <div class="song">
            <h3>Believer</h3>
            <p>Imagine Dragons</p>
        </div>

        <div class="song">
            <h3>Shape of You</h3>
            <p>Ed Sheeran</p>
        </div>

        <div class="song">
            <h3>Faded</h3>
            <p>Alan Walker</p>
        </div>

        <div class="song">
            <h3>Closer</h3>
            <p>Chainsmokers</p>
        </div>

    </div>

</body>

</html>
